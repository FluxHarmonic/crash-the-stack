<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#06080f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crash The Stack</title>
  <!-- The PWA: the manifest makes the hosted build installable on a phone
       (a secure context is required, so the pages.dev site, not the wg0
       dev host). The icon doubles as the favicon. -->
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- The board and, in its top-right corner over the margin the game
         leaves free, the one button the page owns: fullscreen (David,
         2026-09-18: not off to the side; an arrow to the upper right). -->
    <div id="board">
      <canvas id="stage" width="640" height="400"></canvas>
      <button type="button" id="fullscreen" aria-label="fullscreen" title="fullscreen">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M6 2h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          <path d="M14 2L5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
        </svg>
      </button>
    </div>
    <!-- The loader writes "Loading" here while booting and "Failed to start:
         ..." on a boot error; the stylesheet hides the first and shows the
         second, so a phone with no WebGL2 sees the reason, not a black box. -->
    <div id="status"></div>

    <!-- The game's commands (undo, shuffle, hint, next) are drawn on the
         canvas by the game itself and tapped there; the fullscreen button
         above is the page's, a browser matter. No data-key, so the loader
         reports its click as ("click", "fullscreen"), which the game ignores. -->
  </main>

  <script>
  // The page's part of the boot. The generic loader (sigil-web-app.js,
  // sigil 0.22.2) publishes SigilWebApp: a dispatch made before the
  // runtime starts is queued and delivered right after sigil_wasm_start,
  // so the page's parameters reach the game after its entry ran and
  // before its first frame, in one place, once. The loader also forwards
  // a pointerdown on the canvas as ("pointerdown", "x,y,mods") in
  // canvas-buffer pixels, the same coordinate entry point the native
  // mouse uses ((crash input) hit-tests it after (crash geometry) undoes
  // the letterbox); this page no longer carries that shim.
  //
  // POINTER_FORWARDING is the browser arm's positive control: with it
  // false the page claims the canvas's pointerdown (preventDefault, the
  // loader's documented stand-down) and the same synthetic pointerdown
  // must produce no selection.
  (function () {
    "use strict";
    var POINTER_FORWARDING = true;

    // The canvas backing resolution (P3c, the phone's budget): the art is
    // integer-scaled pixel art, so a device pixel ratio above DPR_CAP buys
    // nothing and costs every full-screen pass (a dpr-3 phone rasterizes
    // 2.25x the pixels of dpr 2). The gles3 shell sizes the canvas from
    // window.devicePixelRatio, so the page caps that property before the
    // loader runs. ?dpr=N sets the cap (1, 2, 3; "native" lifts it) so
    // David can compare on the phone; with ?trace the page says which:
    //   crash: page dpr REAL CAP
    var DPR_CAP = 2;
    var realDpr = window.devicePixelRatio || 1;
    (function () {
      var want = new URLSearchParams(location.search).get("dpr");
      var cap = want === "native" ? realDpr : (want && Number(want) > 0 ? Number(want) : DPR_CAP);
      try {
        Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: function () { return Math.min(cap, realDpr); } });
      } catch (e) { /* the property held: the shell sizes at the real dpr */ }
      window.crashDpr = { real: realDpr, cap: cap, effective: window.devicePixelRatio };
    })();

    // The loader's app object. This script runs before the loader tag
    // (the build emits that tag at the end of <body>), so the ready event
    // the loader fires after sigil_wasm_start hands the app over; the
    // first branch covers a page that puts the loader tag first.
    function withApp(fn) {
      if (globalThis.SigilWebApp) { fn(globalThis.SigilWebApp); return; }
      document.addEventListener("sigil-web-app-ready", function (e) { fn(e.detail); }, { once: true });
    }

    // The page's parameters:
    //   trace: the console lines verify.mjs reads.
    //   fresh: ignore the saved board or deal.
    //   cards / stack: straight to that table, past the menu (the
    //          arms' doors); seed=N: the seed a fresh deal or
    //          board starts from.
    //   bg=life|reaction|life-cpu|reaction-cpu|off: the living background's
    //          rule, on the GPU by default (P3c); -cpu the fallback field.
    //   bghold=N / bgonly: the field leg's doors (verify-field.mjs): hold
    //          the field after N steps; draw the background alone.
    //   copper=always|off|bitmap, raster=N: the copper raster over the
    //          field (cleared sequence only by default; always is David's
    //          comparison switch); raster=N fixes its roll (the scanline leg).
    //   phosphor=off|probe: persistence on the cascade off, or the probe.
    //   bgstride=N, rsteps=N: ticks between field steps (3), Gray-Scott
    //          iterations per step (2): David's comparison doors.
    //   dpr=N|native: the canvas backing resolution cap (2 by default).
    //   demo=cleared: the cleared sequence on demand on whichever table
    //          opens (with ?cards the DEFRAG cascade): David judges the
    //          copper roll, the sweep, the split and the phosphor without
    //          winning a board.
    //   atlas=off: text and glyphs drawn as rectangles ((crash font)), not
    //          from the baked atlas: the oracle of the atlas leg.
    //   ms: the frame's wall time in the corner (MS n), David's own
    //          frame-cost readout on the phone.
    //   touch: a touch screen starts every launch with the hint tags
    //          hidden (David, 2026-09-17; Space shows them). Phones
    //          and tablets match (their primary pointer is coarse);
    //          a laptop with a trackpad does not, even one whose
    //          browser reports no hover (2026-09-18: David's laptop
    //          lost the card tags at every launch; hover: none
    //          alone no longer counts). With ?trace the page says
    //          what it saw: "crash: page pointer coarse|fine hover
    //          none|hover".
    var updates = { app: null, ready: function () {} };
    withApp(function (app) {
      var params = new URLSearchParams(location.search);
      var coarse = matchMedia("(pointer: coarse)").matches;
      var noHover = matchMedia("(hover: none)").matches;
      if (params.has("trace")) {
        app.dispatch("trace", "on");
        console.log("crash: page dpr " + window.crashDpr.real + " " + window.crashDpr.effective);
        console.log("crash: page pointer " + (coarse ? "coarse" : "fine") + " hover " + (noHover ? "none" : "hover"));
      }
      if (params.has("fresh")) app.dispatch("fresh", "on");
      if (params.has("cards")) app.dispatch("cards", "on");
      if (params.has("stack")) app.dispatch("stack", "on");
      if (params.has("seed")) app.dispatch("seed", params.get("seed"));
      if (params.has("bg")) app.dispatch("bg", params.get("bg"));
      if (params.has("bghold")) app.dispatch("bghold", params.get("bghold"));
      if (params.has("bgstride")) app.dispatch("bgstride", params.get("bgstride"));
      if (params.has("rsteps")) app.dispatch("rsteps", params.get("rsteps"));
      if (params.has("bgonly")) app.dispatch("bgonly", "on");
      if (params.has("copper")) app.dispatch("copper", params.get("copper"));
      if (params.has("raster")) app.dispatch("raster", params.get("raster"));
      if (params.has("phosphor")) app.dispatch("phosphor", params.get("phosphor"));
      if (params.has("demo")) app.dispatch("demo", params.get("demo"));
      if (params.has("atlas")) app.dispatch("atlas", params.get("atlas"));
      if (params.has("hud")) app.dispatch("hud", params.get("hud"));
      app.dispatch("version", "__VERSION__");
      if (params.has("ms")) app.dispatch("ms", "on");
      if (coarse) app.dispatch("touch", "on");
      updates.app = app;
      updates.ready(app);
      fetchAmbient(app);
    });

    // The ambient loop (P3): s16le mono PCM under assets/audio/, fetched
    // here because the wasm's bridges have no bytes fetch, and handed to
    // the game as base64 chunks through the dispatch ("audio-chunk"),
    // then ("audio-done", n). Fetched after the boot's first seconds,
    // outside the service worker's activation window (the same reason the
    // game's own texture fetches wait), and never fatal: no ambient means
    // sound effects alone. One 16 KB chunk per animation frame: the game
    // decodes each as it lands, so the decode is spread over about a
    // second instead of stalling one frame for that long.
    function fetchAmbient(app) {
      setTimeout(function () {
        fetch("assets/audio/ambient.pcm", { cache: "force-cache" }).then(function (r) {
          if (!r.ok) throw new Error("ambient " + r.status);
          return r.arrayBuffer();
        }).then(function (buf) {
          var bytes = new Uint8Array(buf), CHUNK = 16 * 1024, i = 0, n = 0;
          (function next() {
            if (i >= bytes.length) { app.dispatch("audio-done", String(n)); return; }
            var part = bytes.subarray(i, Math.min(i + CHUNK, bytes.length)), s = "";
            for (var k = 0; k < part.length; k++) s += String.fromCharCode(part[k]);
            app.dispatch("audio-chunk", btoa(s));
            i += CHUNK; n++;
            requestAnimationFrame(next);
          })();
        }).catch(function (err) {
          console.log("crash: ambient failed " + err.message);
        });
      }, 2500);
    }

    // Every user gesture reaches the game as ("gesture", name), so it can
    // resume its audio context whenever the browser has suspended it: a
    // touch counts as activation at pointerup, not pointerdown; iOS
    // suspends on lock; a keyboard-only player never taps.
    ["pointerup", "touchend", "click", "keydown"].forEach(function (name) {
      document.addEventListener(name, function () {
        if (updates.app) updates.app.dispatch("gesture", name);
      }, true);
    });
    globalThis.__crashUpdates = updates;

    var canvas = document.getElementById("stage");

    if (!POINTER_FORWARDING) {
      canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); });
    }

    // The loader maps a swipe anywhere on the document to an arrow key. On
    // the board a swipe would then both select (at pointerdown) and move
    // the keyboard highlight; keep the board to one meaning per gesture by
    // not letting its touches reach the document-level swipe tracking.
    ["touchstart", "touchmove", "touchend"].forEach(function (name) {
      canvas.addEventListener(name, function (e) { e.stopPropagation(); }, { passive: true });
    });

    // Fullscreen toggles on the game container, buttons included, so the
    // board gets the whole phone screen (David, 2026-09-16). The canvas is
    // CSS-sized by the stylesheet, so entering fullscreen resizes it, the
    // gles3 shell resizes the buffer to match each frame, and sigil-graphics
    // recomputes the letterbox scale from the new buffer: nothing here or in
    // the game needs to know. The loader also reports this click as
    // ("click", "fullscreen") to the game, which ignores it.
    var main = document.querySelector("main");
    document.getElementById("fullscreen").addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (main.requestFullscreen) {
        // Rejected without user activation or inside an embed lacking
        // allowfullscreen; say so in the status line instead of throwing.
        main.requestFullscreen({ navigationUI: "hide" }).catch(function (err) {
          document.getElementById("status").textContent = "Fullscreen refused: " + err.message;
        });
      }
    });

    // Keep the screen on while the page is visible (David, 2026-09-17); the
    // lock is dropped by the browser when the page hides and taken again
    // when it shows. Needs a secure context; elsewhere the request rejects
    // and nothing happens.
    var wakeLock = null;
    function keepAwake() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      navigator.wakeLock.request("screen").then(function (lock) { wakeLock = lock; }).catch(function () {});
    }
    document.addEventListener("visibilitychange", keepAwake);
    keepAwake();

    // Tab is the keys-model cycle key; without this the browser also moves
    // focus off the board on every press.
    document.addEventListener("keydown", function (e) {
      if (e.key === "Tab") e.preventDefault();
    }, true);
  })();

  // Updates, ruling D14 (2026-09-17): sw.js is registered at every launch and
  // never skips waiting on its own. The GAME shows the state (a prompt with
  // APPLY / NOT NOW above its HUD at launch, an UPDATE mark in the HUD during
  // play); this page only tells it when a new version is WAITING, polls it
  // for the player's choice, and on APPLY sends SKIP_WAITING and reloads on
  // controllerchange. Nothing else reloads a running board. (One case is
  // the browser's: a waiting worker activates by itself once every tab and
  // the installed app are closed, so the next launch after that boots the
  // new version with no prompt; the board is saved, nothing is lost.)
  // ?force-update=1 is the recovery path: every worker unregistered, every
  // cache deleted, then a plain reload. window.crashUpdate is the state for
  // the browser arm.
  (function () {
    "use strict";
    var app = null;
    var status = { version: "__VERSION__", state: "none", told: null, reg: null };
    window.crashUpdate = status;
    if (!("serviceWorker" in navigator)) { status.state = "unsupported"; return; }
    var params = new URLSearchParams(location.search);
    if (params.get("force-update") === "1") {
      status.state = "forcing";
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        return caches.keys().then(function (names) {
          return Promise.all(names.map(function (n) { return caches.delete(n); }));
        });
      }).then(function () {
        params.delete("force-update");
        var rest = params.toString();
        location.replace(location.pathname + (rest ? "?" + rest : ""));
      });
      return;
    }
    var launchUntil = Date.now() + 8000;
    var gameReady = false;
    var applied = false;
    var polling = null;
    // Tell the game once the loader is up: the launch prompt inside the
    // first seconds, the mark after that; then poll it for the player's
    // APPLY, which it answers through the dispatch's return value (1 once
    // chosen).
    function chosen() {
      return app.dispatch("update", "chosen?") === 1;
    }
    function tell() {
      if (status.state !== "waiting" || !gameReady || status.told) return;
      status.told = Date.now() < launchUntil ? "prompt" : "waiting";
      app.dispatch("update", status.told);
      polling = setInterval(function () { if (chosen()) apply(); }, 500);
    }
    var updates = globalThis.__crashUpdates;
    updates.ready = function (a) { app = a; gameReady = true; tell(); };
    if (updates.app) updates.ready(updates.app);
    function waiting(reg) {
      status.reg = reg;
      status.state = "waiting";
      tell();
    }
    function watch(w, reg) {
      w.addEventListener("statechange", function () {
        if (w.state === "installed" && navigator.serviceWorker.controller) waiting(reg);
      });
    }
    function track(reg) {
      status.reg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) waiting(reg);
      // a worker already installing when the page loaded fired updatefound
      // before anyone listened
      if (reg.installing) watch(reg.installing, reg);
      reg.addEventListener("updatefound", function () {
        if (reg.installing) watch(reg.installing, reg);
      });
    }
    function apply() {
      if (!status.reg || !status.reg.waiting || applied) return;
      applied = true;
      if (polling) clearInterval(polling);
      status.state = "applying";
      status.reg.waiting.postMessage({ type: "SKIP_WAITING" });
    }
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (applied) location.reload();
    });
    status.apply = apply;
    status.check = function () { return status.reg ? status.reg.update() : Promise.resolve(); };
    status.activeVersion = function () {
      return new Promise(function (resolve) {
        var c = navigator.serviceWorker.controller;
        if (!c) { resolve(null); return; }
        var ch = new MessageChannel();
        ch.port1.onmessage = function (e) { resolve(e.data && e.data.version); };
        c.postMessage({ type: "VERSION" }, [ch.port2]);
      });
    };
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
      if (status.state === "none") status.state = "registered";
      track(reg);
    }).catch(function (err) {
      status.state = "failed";
      document.getElementById("status").textContent = "Service worker refused: " + err.message;
    });
  })();
  </script>
  <!--sigil:app-->
</body>
</html>
