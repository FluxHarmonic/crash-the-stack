<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#06080f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crash The Stack</title>
  <!-- The PWA: the manifest makes the hosted build installable on a phone
       (a secure context is required, so the pages.dev site, not the wg0
       dev host). The icon doubles as the favicon. -->
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <canvas id="stage" width="640" height="400"></canvas>
    <!-- The loader writes "Loading" here while booting and "Failed to start:
         ..." on a boot error; the stylesheet hides the first and shows the
         second, so a phone with no WebGL2 sees the reason, not a black box. -->
    <div id="status"></div>

    <!-- The game's commands (undo, shuffle, hint, next) are drawn on the
         canvas by the game itself and tapped there. This one button is the
         page's: fullscreen is a browser matter. No data-key, so the loader
         reports its click as ("click", "fullscreen"), which the game ignores. -->
    <nav class="commands" aria-label="page commands">
      <button type="button" id="fullscreen">full</button>
    </nav>
  </main>

  <script>
  // Pointer forwarding: a tap on the board reaches the game as a
  // ("pointerdown", "bx,by") dispatch in canvas-buffer pixels, the same
  // coordinate entry point the native mouse uses ((crash input) hit-tests
  // it after (crash geometry) undoes the letterbox). The generic loader
  // forwards keys, clicks-by-id and swipes, but not pointer coordinates,
  // and it keeps its wasm instance private; so this page catches the
  // instance where the bridge loader publishes it to every bridge
  // (SigilWasmBridges.setInstance) and calls the same typed dispatch ABI
  // the loader uses. Promotion of this into the loader is a finding for
  // the row, not something this page can do.
  //
  // POINTER_FORWARDING is the browser arm's positive control: with it
  // false, the same synthetic pointerdown must produce no selection.
  (function () {
    "use strict";
    var POINTER_FORWARDING = true;

    var instance = null;
    var bridges = null;
    Object.defineProperty(globalThis, "SigilWasmBridges", {
      configurable: true,
      enumerable: true,
      get: function () { return bridges; },
      set: function (real) {
        bridges = Object.freeze(Object.assign({}, real, {
          setInstance: function (manifest, inst) {
            instance = inst;
            // The page's parameters, all on a later task: setInstance runs
            // before the loader initializes the VM, and a dispatch made here
            // is dropped ("VM not initialized"; measured 2026-09-17, the
            // touch flag went that way). The game boots on its first frame
            // and boots again if a parameter lands after that.
            //   trace: the console lines verify.mjs reads.
            //   fresh: ignore the saved board or deal.
            //   cards / stack: straight to that table, past the menu (the
            //          arms' doors); seed=N: the seed a fresh deal or
            //          board starts from.
            //   touch: a touch screen starts every launch with the hint tags
            //          hidden (David, 2026-09-17; Space shows them). Phones
            //          and tablets match; a touch laptop with a trackpad
            //          does not.
            var params = new URLSearchParams(location.search);
            setTimeout(function () {
              if (params.has("trace")) dispatch("trace", "on");
              if (params.has("fresh")) dispatch("fresh", "on");
              if (params.has("cards")) dispatch("cards", "on");
              if (params.has("stack")) dispatch("stack", "on");
              if (params.has("seed")) dispatch("seed", params.get("seed"));
              if (matchMedia("(pointer: coarse)").matches || matchMedia("(hover: none)").matches) {
                dispatch("touch", "on");
              }
              updates.ready();
            }, 0);
            return real.setInstance(manifest, inst);
          }
        }));
      }
    });

    var encoder = new TextEncoder();
    // The game's answer (an integer), or -1 when it cannot be asked.
    function dispatchRc(type, payload) {
      var ex = instance && instance.exports;
      if (!ex || typeof ex.sigil_wasm_dispatch_event !== "function") return -1;
      function put(s) {
        var bytes = encoder.encode(s + "\0");
        var ptr = ex.malloc(bytes.length);
        new Uint8Array(ex.memory.buffer, ptr, bytes.length).set(bytes);
        return ptr;
      }
      var t = put(type), p = put(payload);
      var rc = ex.sigil_wasm_dispatch_event(t, p);
      ex.free(p); ex.free(t);
      return rc;
    }
    function dispatch(type, payload) { return dispatchRc(type, payload) === 0; }
    var updates = { ready: function () {} };
    globalThis.__crashDispatch = { dispatch: dispatch, dispatchRc: dispatchRc, updates: updates };

    var canvas = document.getElementById("stage");

    // Event point (CSS pixels) -> canvas buffer pixels. The buffer is
    // CSS size x devicePixelRatio after the app shell's resize, so this
    // one factor carries the phone's pixel density. The letterbox inverse
    // is not here: it is (crash geometry)'s frame->virtual, shared with
    // the native shell.
    function bufferPoint(e) {
      var r = canvas.getBoundingClientRect();
      var sx = canvas.width / r.width;
      var sy = canvas.height / r.height;
      return {
        x: Math.round((e.clientX - r.left) * sx),
        y: Math.round((e.clientY - r.top) * sy)
      };
    }

    canvas.addEventListener("pointerdown", function (e) {
      if (!POINTER_FORWARDING) return;
      var p = bufferPoint(e);
      dispatch("pointerdown", p.x + "," + p.y);
      e.preventDefault();
    });

    // The loader maps a swipe anywhere on the document to an arrow key. On
    // the board a swipe would then both select (at pointerdown) and move
    // the keyboard highlight; keep the board to one meaning per gesture by
    // not letting its touches reach the document-level swipe tracking.
    ["touchstart", "touchmove", "touchend"].forEach(function (name) {
      canvas.addEventListener(name, function (e) { e.stopPropagation(); }, { passive: true });
    });

    // Fullscreen toggles on the game container, buttons included, so the
    // board gets the whole phone screen (David, 2026-09-16). The canvas is
    // CSS-sized by the stylesheet, so entering fullscreen resizes it, the
    // gles3 shell resizes the buffer to match each frame, and sigil-graphics
    // recomputes the letterbox scale from the new buffer: nothing here or in
    // the game needs to know. The loader also reports this click as
    // ("click", "fullscreen") to the game, which ignores it.
    var main = document.querySelector("main");
    document.getElementById("fullscreen").addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (main.requestFullscreen) {
        // Rejected without user activation or inside an embed lacking
        // allowfullscreen; say so in the status line instead of throwing.
        main.requestFullscreen({ navigationUI: "hide" }).catch(function (err) {
          document.getElementById("status").textContent = "Fullscreen refused: " + err.message;
        });
      }
    });

    // Keep the screen on while the page is visible (David, 2026-09-17); the
    // lock is dropped by the browser when the page hides and taken again
    // when it shows. Needs a secure context; elsewhere the request rejects
    // and nothing happens.
    var wakeLock = null;
    function keepAwake() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
      navigator.wakeLock.request("screen").then(function (lock) { wakeLock = lock; }).catch(function () {});
    }
    document.addEventListener("visibilitychange", keepAwake);
    keepAwake();

    // Tab is the keys-model cycle key; without this the browser also moves
    // focus off the board on every press.
    document.addEventListener("keydown", function (e) {
      if (e.key === "Tab") e.preventDefault();
    }, true);
  })();

  // Updates, ruling D14 (2026-09-17): sw.js is registered at every launch and
  // never skips waiting on its own. The GAME shows the state (a prompt with
  // APPLY / NOT NOW above its HUD at launch, an UPDATE mark in the HUD during
  // play); this page only tells it when a new version is WAITING, polls it
  // for the player's choice, and on APPLY sends SKIP_WAITING and reloads on
  // controllerchange. Nothing else reloads a running board. (One case is
  // the browser's: a waiting worker activates by itself once every tab and
  // the installed app are closed, so the next launch after that boots the
  // new version with no prompt; the board is saved, nothing is lost.)
  // ?force-update=1 is the recovery path: every worker unregistered, every
  // cache deleted, then a plain reload. window.crashUpdate is the state for
  // the browser arm.
  (function () {
    "use strict";
    var bridge = globalThis.__crashDispatch;
    var status = { version: "__VERSION__", state: "none", told: null, reg: null };
    window.crashUpdate = status;
    if (!("serviceWorker" in navigator)) { status.state = "unsupported"; return; }
    var params = new URLSearchParams(location.search);
    if (params.get("force-update") === "1") {
      status.state = "forcing";
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        return caches.keys().then(function (names) {
          return Promise.all(names.map(function (n) { return caches.delete(n); }));
        });
      }).then(function () {
        params.delete("force-update");
        var rest = params.toString();
        location.replace(location.pathname + (rest ? "?" + rest : ""));
      });
      return;
    }
    var launchUntil = Date.now() + 8000;
    var gameReady = false;
    var applied = false;
    var polling = null;
    // Tell the game once it is up: the launch prompt inside the first
    // seconds, the mark after that; then watch for its APPLY, which the
    // game leaves in localStorage under "update" (the dispatch ABI's return
    // value does not carry a handler's answer).
    function chosen() {
      try { return localStorage.getItem("update") === "apply"; } catch (e) { return false; }
    }
    function tell() {
      if (status.state !== "waiting" || !gameReady || status.told) return;
      status.told = Date.now() < launchUntil ? "prompt" : "waiting";
      bridge.dispatch("update", status.told);
      polling = setInterval(function () { if (chosen()) apply(); }, 500);
    }
    bridge.updates.ready = function () { gameReady = true; tell(); };
    function waiting(reg) {
      status.reg = reg;
      status.state = "waiting";
      tell();
    }
    function watch(w, reg) {
      w.addEventListener("statechange", function () {
        if (w.state === "installed" && navigator.serviceWorker.controller) waiting(reg);
      });
    }
    function track(reg) {
      status.reg = reg;
      if (reg.waiting && navigator.serviceWorker.controller) waiting(reg);
      // a worker already installing when the page loaded fired updatefound
      // before anyone listened
      if (reg.installing) watch(reg.installing, reg);
      reg.addEventListener("updatefound", function () {
        if (reg.installing) watch(reg.installing, reg);
      });
    }
    function apply() {
      if (!status.reg || !status.reg.waiting || applied) return;
      applied = true;
      if (polling) clearInterval(polling);
      try { localStorage.removeItem("update"); } catch (e) {}
      status.state = "applying";
      status.reg.waiting.postMessage({ type: "SKIP_WAITING" });
    }
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (applied) location.reload();
    });
    status.apply = apply;
    status.check = function () { return status.reg ? status.reg.update() : Promise.resolve(); };
    status.activeVersion = function () {
      return new Promise(function (resolve) {
        var c = navigator.serviceWorker.controller;
        if (!c) { resolve(null); return; }
        var ch = new MessageChannel();
        ch.port1.onmessage = function (e) { resolve(e.data && e.data.version); };
        c.postMessage({ type: "VERSION" }, [ch.port2]);
      });
    };
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (reg) {
      if (status.state === "none") status.state = "registered";
      track(reg);
    }).catch(function (err) {
      status.state = "failed";
      document.getElementById("status").textContent = "Service worker refused: " + err.message;
    });
  })();
  </script>
  <!--sigil:app-->
</body>
</html>
