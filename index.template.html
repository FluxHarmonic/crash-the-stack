<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#06080f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Crash The Stack</title>
  <!-- The PWA: the manifest makes the hosted build installable on a phone
       (a secure context is required, so the pages.dev site, not the wg0
       dev host). The icon doubles as the favicon. -->
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- The board and, in its top-right corner over the margin the game
         leaves free, the one button the page owns: fullscreen (David,
         2026-09-18: not off to the side; an arrow to the upper right). -->
    <div id="board">
      <canvas id="stage" width="640" height="400"></canvas>
      <button type="button" id="fullscreen" aria-label="fullscreen" title="fullscreen">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M6 2h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
          <path d="M14 2L5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
        </svg>
      </button>
      <!-- The RECONNECT card (the web soak row): shown by the page guard
           over the last frame once the wasm instance is dead (a trap, a
           FATAL line, a lost WebGL context); a tap reloads. The word is
           drawn into its canvas in the block alphabet by the guard script. -->
      <div id="reconnect" hidden>
        <canvas id="reconnect-word" width="568" height="56" aria-hidden="true"></canvas>
        <p>LINK DROPPED. TAP TO RECONNECT.</p>
      </div>
    </div>
    <!-- The loader writes "Loading" here while booting and "Failed to start:
         ..." on a boot error; the stylesheet hides the first and shows the
         second, so a phone with no WebGL2 sees the reason, not a black box. -->
    <div id="status"></div>

    <!-- The game's commands (undo, shuffle, hint, next) are drawn on the
         canvas by the game itself and tapped there; the fullscreen button
         above is the page's, a browser matter. No data-key, so the loader
         reports its click as ("click", "fullscreen"), which the game ignores. -->
  </main>

  <script>
  // The page's part of the boot. The generic loader (sigil-web-app.js,
  // sigil 0.22.2) publishes SigilWebApp: a dispatch made before the
  // runtime starts is queued and delivered right after sigil_wasm_start,
  // so the page's parameters reach the game after its entry ran and
  // before its first frame, in one place, once. The loader also forwards
  // a pointerdown on the canvas as ("pointerdown", "x,y,mods") in
  // canvas-buffer pixels, the same coordinate entry point the native
  // mouse uses ((crash input) hit-tests it after (crash geometry) undoes
  // the letterbox); this page no longer carries that shim.
  //
  // POINTER_FORWARDING is the browser arm's positive control: with it
  // false the page claims the canvas's pointerdown (preventDefault, the
  // loader's documented stand-down) and the same synthetic pointerdown
  // must produce no selection.
  // ?rate=N (M1, D59): the audio context at N Hz instead of the device's
  // rate; the browser resamples its output to the device. The live synth's
  // cost scales with the rate (PULL in the ?ms readout is per 1024 frames
  // at RATE), so 22050 halves the per-frame cost against 44100 and more
  // against 48000, at the cues' and the music's bandwidth. A measurement
  // door for David's phone; the bridge reads window.AudioContext when the
  // game opens its context, so the shim must be in place before then.
  (function () {
    var m = /[?&]rate=(\d+)(&|$)/.exec(location.search);
    if (!m || !window.AudioContext) return;
    var rate = Number(m[1]), AC = window.AudioContext;
    var Shim = function (opts) { return new AC(Object.assign({}, opts || {}, { sampleRate: rate })); };
    Shim.prototype = AC.prototype;
    window.AudioContext = Shim;
  })();

  (function () {
    "use strict";
    var POINTER_FORWARDING = true;
    var revealOver = null;
    window.crashRevealOver = new Promise(function (resolve) { revealOver = resolve; });
    // and the menu live (the reveal settled, the boot's steps done, or a table
    // up): the worker registers then, so its precache never shares the boot
    // window with the boot's own fetches (David's phone, 2026-09-20: every
    // texture fetch in the first ~4 s failed while the worker precached the
    // wasm over WireGuard); resolved by the game's word or at 90 s (a slow link)
    var liveDone = null;
    window.crashLive = new Promise(function (resolve) { liveDone = resolve; });
    setTimeout(function () { liveDone(); }, 90000);
    setTimeout(function () { revealOver(); }, 20000);

    // The canvas backing resolution (P3c, the phone's budget): the art is
    // integer-scaled pixel art, so a device pixel ratio above DPR_CAP buys
    // nothing and costs every full-screen pass (a dpr-3 phone rasterizes
    // 2.25x the pixels of dpr 2). The gles3 shell sizes the canvas from
    // window.devicePixelRatio, so the page caps that property before the
    // loader runs. ?dpr=N sets the cap (1, 2, 3; "native" lifts it) so
    // David can compare on the phone; with ?trace the page says which:
    //   crash: page dpr REAL CAP
    var DPR_CAP = 2;
    var realDpr = window.devicePixelRatio || 1;
    (function () {
      var want = new URLSearchParams(location.search).get("dpr");
      var cap = want === "native" ? realDpr : (want && Number(want) > 0 ? Number(want) : DPR_CAP);
      try {
        Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: function () { return Math.min(cap, realDpr); } });
      } catch (e) { /* the property held: the shell sizes at the real dpr */ }
      window.crashDpr = { real: realDpr, cap: cap, effective: window.devicePixelRatio };
    })();

    // The loader's app object. This script runs before the loader tag
    // (the build emits that tag at the end of <body>), so the ready event
    // the loader fires after sigil_wasm_start hands the app over; the
    // first branch covers a page that puts the loader tag first.
    function withApp(fn) {
      if (globalThis.SigilWebApp) { fn(globalThis.SigilWebApp); return; }
      document.addEventListener("sigil-web-app-ready", function (e) { fn(e.detail); }, { once: true });
    }


    // When the page's fetches are safe (ruling D40): the service worker
    // is active (navigator.serviceWorker.ready, plus a 750 ms grace), or there is none, or 2.5
    // s passed. A fetch pending while the worker activates failed under
    // load (P3), which is what the game's texture delay and the ambient's
    // timer guarded against; this resolves as soon as the real condition
    // holds, so on a revisit the boot's steps start at once. Told to the
    // game as ("sw", "ready").
    var swReady = new Promise(function (resolve) {
      var done = false, fire = function () { if (!done) { done = true; resolve(); } };
      setTimeout(fire, 2500);
      if (!("serviceWorker" in navigator)) { fire(); return; }
      // no worker controls this page (a fresh origin, or the worker not yet
      // registered: it registers after the menu is live): nothing activates
      // over the boot, so the boot's fetches start at once
      if (!navigator.serviceWorker.controller) { fire(); return; }
      // 750 ms after activation, not at it: a fetch made right at ready still
      // failed under load (2026-09-19, the arm), the P3 finding again; the
      // page retries a lost ambient fetch and the game a lost texture fetch
      navigator.serviceWorker.ready.then(function () { setTimeout(fire, 750); }, fire);
    });

    // The page's parameters:
    //   trace: the console lines verify.mjs reads.
    //   fresh: ignore the saved board or deal.
    //   cards / stack: straight to that table, past the menu (the
    //          arms' doors); seed=N: the seed a fresh deal or
    //          board starts from.
    //   bg=reaction|cyclic|flow|signal|echo|synapse|flame|still|reaction-cpu|off: the living background's
    //          rule, reaction on the GPU by default (P3c; David, 2026-09-20); -cpu the fallback field.
    //   bghold=N / bgonly: the field leg's doors (verify-field.mjs): hold
    //          the field after N steps; draw the background alone.
    //   copper=always|off|bitmap, raster=N: the copper raster over the
    //          field (cleared sequence only by default; always is David's
    //          comparison switch); raster=N fixes its roll (the scanline leg).
    //   phosphor=off|probe: persistence on the cascade off, or the probe.
    //   bgstride=N, rsteps=N: ticks between field steps (3), Gray-Scott
    //          iterations per step (2): David's comparison doors.
    //   dpr=N|native: the canvas backing resolution cap (2 by default).
    //   demo=cleared: the cleared sequence on demand on whichever table
    //          opens (with ?cards the DEFRAG cascade): David judges the
    //          copper roll, the sweep, the split and the phosphor without
    //          winning a board.
    //   atlas=off: text and glyphs drawn as rectangles ((crash font)), not
    //          from the baked atlas: the oracle of the atlas leg.
    //   ms: also keeps the last minute of frame samples; a tap on the readout
    //          (top right) copies the summary to the clipboard, or shows it
    //          in a selectable overlay when the clipboard is refused. Reset & close
    //          starts a fresh measurement window; wait, then tap the readout again.
    //   music-rate=N: the live soundtrack rendered at N Hz and upsampled (M1;
    //          none: the game's ladder picks from the device's measured cost).
    //   adepth=N: frames the audio keeps ahead of the output (6144: the
    //          cue latency and the stall a frame may take; 3072 was P3's).
    //   ms: the frame's wall time in the corner (MS n), David's own
    //          frame-cost readout on the phone.
    //   touch: a touch screen starts every launch with the hint tags
    //          hidden (David, 2026-09-17; Space shows them). Phones
    //          and tablets match (their primary pointer is coarse);
    //          a laptop with a trackpad does not, even one whose
    //          browser reports no hover (2026-09-18: David's laptop
    //          lost the card tags at every launch; hover: none
    //          alone no longer counts). With ?trace the page says
    //          what it saw: "crash: page pointer coarse|fine hover
    //          none|hover".
    // The page's own frame clock (P3c): every requestAnimationFrame
    // callback is timed around, so the summary can say what the game's
    // callback costs on the wall (the wasm tick plus the loader's bridge
    // and the JS the frame runs through) against the interval the browser
    // gave it; the rest of the interval is the browser's (compositing,
    // the GPU, other tabs, a throttled rAF). David's phone at 9f897bc:
    // 49 ms frames of which the wasm timers saw 17; this is the hole.
    // Multiple callbacks can share one animation frame (including an audio
    // upload). Aggregate their cost instead of treating each as another frame.
    var pageFrames = { cb: [], gap: [], stamp: null, start: 0, cost: 0, epoch: 0, ignore: null };
    var audioWork = { upload: [], finish: [], settled: 0, failed: 0, loading: "none" };
    var audioOutput = { mode: "unobserved", context: null, block: 0, previous: null, gaps: [] };
    function remember(xs, value) { xs.push(value); if (xs.length > 3600) xs.shift(); }
    // ?ms observes the actual output node, including a failed worklet's
    // fallback. Ring starvation and late main-thread output are different:
    // ScriptProcessor can miss its deadline while the PCM ring stays full.
    (function () {
      if (typeof AudioContext === "undefined" || !new URLSearchParams(location.search).has("ms")) return;
      var create = AudioContext.prototype.createScriptProcessor;
      AudioContext.prototype.createScriptProcessor = function () {
        var node = create.apply(this, arguments);
        audioOutput.mode = "scriptprocessor"; audioOutput.context = this; audioOutput.block = node.bufferSize;
        node.addEventListener("audioprocess", function () {
          var now = performance.now();
          if (audioOutput.previous !== null) remember(audioOutput.gaps, now - audioOutput.previous);
          audioOutput.previous = now;
        });
        return node;
      };
      if (typeof window.AudioWorkletNode === "function") {
        window.AudioWorkletNode = new Proxy(window.AudioWorkletNode, {
          construct: function (ctor, args) {
            var node = Reflect.construct(ctor, args);
            audioOutput.mode = "worklet"; audioOutput.context = args[0]; audioOutput.block = 0;
            return node;
          }
        });
      }
    })();
    function resetPageStats() {
      pageFrames.ignore = pageFrames.stamp;
      pageFrames.stamp = null; pageFrames.start = 0; pageFrames.cost = 0;
      pageFrames.cb = []; pageFrames.gap = []; pageFrames.epoch++;
      audioWork.upload = []; audioWork.finish = [];
      audioOutput.previous = null; audioOutput.gaps = [];
    }
    (function () {
      var raf = window.requestAnimationFrame;
      window.requestAnimationFrame = function (cb) {
        return raf.call(window, function (stamp) {
          if (stamp === pageFrames.ignore) return cb(stamp);
          var t0 = performance.now();
          if (stamp !== pageFrames.stamp) {
            if (pageFrames.stamp !== null) {
              remember(pageFrames.gap, t0 - pageFrames.start);
              remember(pageFrames.cb, pageFrames.cost);
            }
            pageFrames.stamp = stamp; pageFrames.start = t0; pageFrames.cost = 0;
          }
          var epoch = pageFrames.epoch;
          try { return cb(stamp); }
          finally { if (epoch === pageFrames.epoch) pageFrames.cost += performance.now() - t0; }
        });
      };
    })();
    window.crashPageStats = function () { return pageStats(); };
    window.crashResetStats = function () {
      if (!updates.app) return false;
      updates.app.dispatch("stats", "reset");
      return true;
    };
    function pageStats() {
      var line = function (name, xs) {
        if (!xs.length) return name + " (no samples)";
        var s = xs.slice().sort(function (a, b) { return a - b; });
        var mean = xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
        var pick = function (p) { return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };
        return name + " mean " + mean.toFixed(1) + " p50 " + pick(0.5).toFixed(1) + " p95 " + pick(0.95).toFixed(1) + " max " + s[s.length - 1].toFixed(1);
      };
      var over = pageFrames.cb.filter(function (c) { return c > 16.7; }).length;
      var ctx = audioOutput.context;
      return "page raf-interval " + line("", pageFrames.gap).trim() + "\npage callback " + line("", pageFrames.cb).trim() + "\npage callbacks over 16.7 ms " + over + " of " + pageFrames.cb.length +
        "\npage music settled " + audioWork.settled + "/3 failed " + audioWork.failed + " loading " + audioWork.loading +
        "\n" + line("page audio-upload", audioWork.upload) + "\n" + line("page audio-finish", audioWork.finish) +
        "\npage audio node " + audioOutput.mode + " state " + (ctx ? ctx.state : "unknown") +
        " rate " + (ctx ? ctx.sampleRate : 0) + " block " + audioOutput.block +
        " secure " + (window.isSecureContext ? "yes" : "no") + " isolated " + (window.crossOriginIsolated ? "yes" : "no") +
        "\n" + line("page audio-callback-gap", audioOutput.gaps);
    }

    // The live soundtrack (M1, D59): the game asks for a tune's text with
    // one "crash: tune-fetch NAME" line; the page fetches assets/tunes/NAME.cts
    // and hands it over in 12 KB base64 chunks then ("tune-done", NAME). A
    // failure says "crash: tune-unavailable NAME" (a prefix this hook does not
    // act on) after two retries for network-level failures, none for a 404.
    function fetchTune(name, attempt) {
      attempt = attempt || 1;
      if (!/^[a-z0-9-]+$/.test(name)) { console.log("crash: tune-unavailable " + name + " (not a bundled name)"); return; }
      withApp(function (app) {
        fetch("assets/tunes/" + name + ".cts", { cache: "force-cache" }).then(function (r) {
          if (!r.ok) throw new Error("tune " + r.status);
          return r.text();
        }).then(function (text) {
          var bytes = new TextEncoder().encode(text), CHUNK = 12 * 1024, i = 0;
          while (i < bytes.length) {
            var part = bytes.subarray(i, Math.min(i + CHUNK, bytes.length)), s = "";
            for (var k = 0; k < part.length; k++) s += String.fromCharCode(part[k]);
            app.dispatch("tune-chunk", btoa(s));
            i += CHUNK;
          }
          app.dispatch("tune-done", name);
        }, function (err) {
          if (attempt < 3 && !/tune 404/.test(err.message)) { setTimeout(function () { fetchTune(name, attempt + 1); }, 800); return; }
          console.log("crash: tune-unavailable " + name + " " + err.message + " (try " + attempt + ")");
        });
      });
    }

    // The stats summary (P3c): with ?ms a tap on the readout makes the
    // game print one "crash: clipboard TEXT" line (newlines as ~). This
    // hook copies it to the clipboard, or shows it in a selectable overlay
    // when the clipboard is refused (a page that is not focused, an
    // http origin on some browsers); the console keeps the line either way.
    (function () {
      var log = console.log;
      console.log = function () {
        var first = arguments[0];
        if (typeof first === "string" && first.indexOf("crash: stats reset ") === 0) resetPageStats();
        // FREE PLAY > TRACKER: the tracker is its own page (P3b, David 2026-09-21)
        if (first === "crash: open tracker") location.assign("tracker/");
        if (typeof first === "string" && first.indexOf("crash: tune-fetch ") === 0) fetchTune(first.slice("crash: tune-fetch ".length).trim());   // the live soundtrack (M1)
        if (typeof first === "string" && first.indexOf("crash: clipboard ") === 0) {
          var text = first.slice("crash: clipboard ".length).split("~").join("\n") + "\n" + pageStats();
          log.call(console, "crash: page-stats " + pageStats().split("\n").join("~"));
          var show = function (why) {
            var old = document.getElementById("stats-overlay");
            if (old) old.remove();
            var box = document.createElement("div"); box.id = "stats-overlay";
            box.style.cssText = "position:fixed;left:8px;top:8px;right:8px;max-height:80%;overflow:auto;background:#0d0a1a;color:#cce6ff;border:1px solid #4df2d9;padding:8px;font:12px monospace;z-index:20;white-space:pre-wrap;user-select:text;-webkit-user-select:text";
            var close = document.createElement("button"); close.textContent = "close"; close.style.cssText = "float:right;margin-left:8px";
            close.addEventListener("click", function () { box.remove(); });
            var reset = document.createElement("button"); reset.textContent = "Reset & close";
            reset.style.cssText = "float:right;margin-left:8px";
            reset.addEventListener("click", function () { if (window.crashResetStats()) box.remove(); });
            box.appendChild(close); box.appendChild(reset);
            box.appendChild(document.createTextNode(why + text));
            document.body.appendChild(box);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { show("copied to the clipboard\n\n"); }, function () { show("clipboard refused; select and copy\n\n"); });
          } else show("no clipboard here; select and copy\n\n");
        }
        return log.apply(console, arguments);
      };
    })();

    var updates = { app: null, ready: function () {} };
    withApp(function (app) {
      var params = new URLSearchParams(location.search);
      var coarse = matchMedia("(pointer: coarse)").matches;
      var noHover = matchMedia("(hover: none)").matches;
      if (params.has("trace")) {
        app.dispatch("trace", "on");
        console.log("crash: page dpr " + window.crashDpr.real + " " + window.crashDpr.effective);
        console.log("crash: page pointer " + (coarse ? "coarse" : "fine") + " hover " + (noHover ? "none" : "hover"));
      }
      if (params.has("fresh")) app.dispatch("fresh", "on");
      if (params.has("cards")) app.dispatch("cards", "on");
      if (params.has("stack")) app.dispatch("stack", "on");
      if (params.has("seed")) app.dispatch("seed", params.get("seed"));
      if (params.has("bg")) app.dispatch("bg", params.get("bg"));
      if (params.has("bghold")) app.dispatch("bghold", params.get("bghold"));
      if (params.has("bgstride")) app.dispatch("bgstride", params.get("bgstride"));
      if (params.has("rsteps")) app.dispatch("rsteps", params.get("rsteps"));
      if (params.has("bgonly")) app.dispatch("bgonly", "on");
      if (params.has("copper")) app.dispatch("copper", params.get("copper"));
      if (params.has("raster")) app.dispatch("raster", params.get("raster"));
      if (params.has("phosphor")) app.dispatch("phosphor", params.get("phosphor"));
      if (params.has("demo")) app.dispatch("demo", params.get("demo"));
      if (params.has("atlas")) app.dispatch("atlas", params.get("atlas"));
      if (params.has("adepth")) app.dispatch("adepth", params.get("adepth"));
      // M1: the music's render rate pinned (music-rate=N), else the game's ladder
      // starts one step down on a weak device (the hints: cores and memory)
      if (params.has("music-rate")) app.dispatch("music-rate", params.get("music-rate"));
      if (params.has("music-budget")) app.dispatch("music-budget", params.get("music-budget"));   // the ladder forced (the arm)
      app.dispatch("device", (navigator.hardwareConcurrency || 0) + "," + (navigator.deviceMemory || 0));
      if (params.has("code")) app.dispatch("code", params.get("code"));   // P4: a share code's board at boot
      if (params.has("skip")) app.dispatch("skip", params.get("skip"));   // the soak's bisection door: parts of the tick left out
      // P4: the pause menu's COPY: the game answers 1 once when asked, and the
      // code is in the store under "code"; the clipboard write needs a recent
      // gesture (the tap that asked), so the poll is quick
      setInterval(function () {
        try {
          if (app.dispatch("copy", "asked?") === 1) {
            var code = localStorage.getItem("code");
            if (code && navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(code).then(function () { console.log("crash: copied " + code); },
                                                      function (e) { console.log("crash: copy failed " + e); });
            } else console.log("crash: copy unavailable " + (code || "no code"));
          }
        } catch (e) { console.log("crash: copy poll error " + e); }
      }, 300);
      app.dispatch("version", "__VERSION__");
      if (params.has("ms")) app.dispatch("ms", "on");
      app.dispatch("dpr", String(window.crashDpr.effective));
      if (params.has("baud")) app.dispatch("baud", params.get("baud"));
      if (params.has("glitch")) app.dispatch("glitch", params.get("glitch"));
      if (params.has("slant")) app.dispatch("slant", params.get("slant"));
      if (params.has("bake")) app.dispatch("bake", params.get("bake"));
      if (params.has("diag")) app.dispatch("diag", "on");
      if (params.has("card")) app.dispatch("card", params.get("card"));
      if (params.has("dial")) app.dispatch("dial", params.get("dial"));
      app.dispatch("clock", String(Date.now() % 2147483647));
      app.dispatch("epoch", params.has("epoch") ? params.get("epoch") : String(Math.floor(Date.now() / 1000)));   // P4: the daily's day, the run seed (?epoch=N is the arm's door)
      if (coarse) app.dispatch("touch", "on");
      updates.app = app;
      updates.ready(app);
      // The reveal's frames belong to the reveal (David, on the phone:
      // "extremely glitchy at startup ... with the typing beeps"): the
      // ambient's chunk decodes and the worker's precache of a new version
      // wait until the game says the reveal is over (("title", "running?")
      // answers 1 while it runs; a ?stack boot has none), or 20 s. The
      // promise itself is made at script load (the worker script reads it).
      (function poll() {
        if (app.dispatch("title", "running?") !== 1) { revealOver(); return; }
        setTimeout(poll, 200);
      })();
      swReady.then(function () { app.dispatch("sw", "ready"); });
      (function pollLive() {
        if (app.dispatch("title", "live?") === 1) { liveDone(); return; }
        setTimeout(pollLive, 500);
      })();
      Promise.all([swReady, window.crashRevealOver]).then(function () { fetchAmbient(app); });
    });

    // The music (P4, ruling D50): three OGG Vorbis tunes under
    // assets/audio/ (mono 22050, ~1 MB each: the 7 MB PCM renders are not
    // shipped), fetched here because the wasm's bridges have no bytes
    // fetch, decoded by the browser (decodeAudioData on an offline context
    // at the tune's rate, so no resampling), and handed to the game as
    // s16le mono PCM in base64 chunks through the dispatch: ("track",
    // NAME) opens one, ("audio-size", bytes) reserves its PCM buffer,
    // ("audio-chunk", b64) fills it, ("audio-done", n)
    // closes it; ("audio-done", 0) after ("track", NAME) means that tune
    // was given up. The menu theme (spy) goes first: the boot's audio step
    // waits for it (D40); the others land while the menu is up. Fetched
    // once swReady resolves, outside the service worker's activation
    // window, and never fatal: no tune means sound effects alone. One
    // 512 KB chunk per animation frame (the game decodes it in C; the
    // ambient's 16 KB a frame would take a 7.5 MB tune 460 frames, minutes

      launchUntil = Date.now() + 8000;
      status.launchUntil = launchUntil;   // the browser arm waits for the window to close before a mid-board check
      console.log("crash: sw registered");   // the arms read it (the registration waits for the menu to be live)
      track(reg);
    }).catch(function (err) {
      status.state = "failed";
      document.getElementById("status").textContent = "Service worker refused: " + err.message;
    });
  })();
  </script>
  <!--sigil:app-->
</body>
