<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#06080f">
  <title>Motif Tracker</title>
  <!-- The tracker's own page (David, 2026-09-21: the tracker is its own wasm
       behind /tracker/, so the game's wasm carries no editor). The stylesheet
       is the game's (the build copies it here); the loader, the bridges,
       crash-tracker.wasm and the bundled tunes are here, so the page is
       self-contained wherever it is served. The build (package.sgl,
       tracker-page) puts the loader's
       mount and script tag at the marker and stamps __VERSION__. -->
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="help" href="../docs/tracker/">
  <style>
    #stage:focus { outline: none; }
    /* the manual, under the canvas: a rel=help link is invisible, and a
       tracker whose keys are undiscoverable is a tracker nobody uses
       (reviewer, 2026-09-23) */
    .page-links { max-width: 640px; margin: 8px auto 24px; padding: 0 8px;
                  font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                  letter-spacing: .08em; text-transform: uppercase; }
    .page-links a { color: #4df2d9; text-decoration: none; }
    .page-links a:hover { color: #ff59d9; }
    .page-links span { color: #7380a6; padding: 0 .6em; }
  </style>
</head>
<body>
  <main>
    <div id="board">
      <canvas id="stage" width="640" height="400" tabindex="0"></canvas>
    </div>
    <nav class="page-links">
      <a href="../docs/tracker/">Manual</a><span>/</span><a href="../jack-in/">Play the game</a><span>/</span><a href="../">crashthestack.com</a>
    </nav>
    <script>
    // The WebGL 2 check, before anything boots (a visitor on phantomburn.net
    // hit the raw "Failed to start: sigil_wasm_start failed (rc -1)",
    // 2026-09-29; this page had the same failure). Substratic's, from
    // substratic.js's "webgl" section (substratic 0.2.3), copied as is: this
    // page doesn't load substratic.js. It must come before the loader's tag
    // (the build's app marker), which it switches off without WebGL 2.
    (function () {
      "use strict";
  // ---- webgl -------------------------------------------------------------------
  // (substratic.js's WebGL check; copied as is into pages that don't load it)
  //
  // Every Substratic game draws with WebGL 2. Without it (graphics
  // acceleration off, a blocklisted GPU, a browser started without GPU
  // access) the wasm starts, fails to get a context, and the loader shows
  // "Failed to start: sigil_wasm_start failed (rc -1)", which tells a player
  // nothing. So, before the wasm boots:
  //   - a throwaway canvas is asked for "webgl2" (with the attributes the
  //     gles3 bridge asks for), then "webgl", so the message can say whether
  //     WebGL is off entirely or only WebGL 2 is missing;
  //   - with no WebGL 2, the loader's script tag (the build's app marker,
  //     which must come after this script) is switched to text/plain as the
  //     parser inserts it, before it runs, so the wasm is never fetched
  //     (a MutationObserver: the parser delivers mutation records before it
  //     runs a script; "beforescriptexecute" for Firefox before 109);
  //   - a message in the page says what to do (#sub-webgl, data-webgl "none"
  //     or "webgl1"; body.sub-nowebgl).
  // And late: a start that fails for want of a WebGL 2 context (the game's
  // "no WebGL2 context" line) shows the message (data-webgl "late") in
  // place of the loader's "Failed to start: ...". If the loader ran anyway
  // without WebGL 2, its "Failed to start" is cleared the same way.
  //
  // cfg.webglCheck (default true) turns it on; cfg.webglText overrides any
  // of the strings below (title, none, webgl1, late, advice, test). The
  // panel's style goes first in <head>, so a page's own CSS for #sub-webgl
  // wins. Returns "webgl2", "webgl1", "none", or "off" (the check turned off).
  function webglGuard(cfg) {
    if (cfg.webglCheck === false) return "off";
    var LOADER = /(^|\/)sigil-web-app\.js(\?|#|$)/;
    var text = Object.assign({
      title: "This game needs WebGL 2, and your browser isn't providing it.",
      none: "WebGL is turned off in this browser, or it can't reach your graphics card. Usually that means graphics acceleration is off.",
      webgl1: "Your browser has WebGL, but not WebGL 2. Usually that means graphics acceleration is off, or the browser is too old for it " +
              "(on an iPhone, iPad or Mac, updating the system updates Safari; in Firefox, check that webgl.enable-webgl2 is true in about:config).",
      late: "Your browser has WebGL 2, but it couldn't give the game a WebGL 2 context. Closing other tabs that use graphics, or restarting the browser, usually fixes it.",
      advice: "Turn on \"Use graphics acceleration when available\" (Chrome, Edge) or check that WebGL is enabled (Firefox: about:config, webgl.disabled set to false), then restart the browser. " +
              "If you launched the browser in a special way (a remote desktop, a sandbox, a VM), try opening it normally. Or try another browser.",
      test: "Check what your browser supports at get.webgl.org/webgl2."
    }, cfg.webglText || {});
    var TEST_URL = "https://get.webgl.org/webgl2/";

    function probe(kind) {
      try {
        var gl = document.createElement("canvas").getContext(kind, { alpha: false, antialias: false, depth: false, stencil: false });
        if (!gl) return false;
        var lose = gl.getExtension("WEBGL_lose_context");   // give the context back now
        if (lose) lose.loseContext();
        return true;
      } catch (err) { return false; }
    }
    function loaderMount() {                                // the loader shows its errors here
      var all = document.querySelectorAll("script[src]"), s = null;
      for (var i = 0; i < all.length; i++) if (LOADER.test(all[i].getAttribute("src"))) s = all[i];
      return document.getElementById((s && s.getAttribute("data-mount")) || "app");
    }
    function clearFailed() {
      var m = loaderMount();
      if (m && /^Failed to start/.test(m.textContent)) m.textContent = "";
    }
    function show(level) {
      if (level === "late") clearFailed();
      if (document.getElementById("sub-webgl")) return;
      if (!document.body) { document.addEventListener("DOMContentLoaded", function () { show(level); }); return; }
      var css = document.createElement("style");
      css.textContent =
        "#sub-webgl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);-webkit-transform:translate(-50%,-50%);z-index:20;" +
        "box-sizing:border-box;width:92%;max-width:40em;max-height:92%;overflow:auto;padding:20px 22px;background:#000;" +
        "border:1px solid rgba(170,170,187,.4);border-radius:6px;color:#aab;font:14px/1.5 ui-monospace,monospace;text-align:left}" +
        "#sub-webgl h1{margin:0 0 12px;font:bold 16px/1.4 ui-monospace,monospace;color:#dde}" +
        "#sub-webgl p{margin:0 0 10px}" +
        "#sub-webgl a{color:#9cf}";
      document.head.insertBefore(css, document.head.firstChild);
      var box = document.createElement("div");
      box.id = "sub-webgl";
      box.setAttribute("role", "alert");
      box.setAttribute("data-webgl", level);
      var h = document.createElement("h1"); h.textContent = text.title; box.appendChild(h);
      [text[level] || text.none, text.advice].forEach(function (t) {
        var p = document.createElement("p"); p.textContent = t; box.appendChild(p);
      });
      var p = document.createElement("p"), host = "get.webgl.org/webgl2", at = text.test.indexOf(host);
      var a = document.createElement("a"); a.href = TEST_URL; a.target = "_blank"; a.rel = "noopener";
      if (at >= 0) {                                         // the link on the address, where the text names it
        p.appendChild(document.createTextNode(text.test.slice(0, at)));
        a.textContent = host; p.appendChild(a);
        p.appendChild(document.createTextNode(text.test.slice(at + host.length)));
      } else { p.appendChild(document.createTextNode(text.test + " ")); a.textContent = TEST_URL; p.appendChild(a); }
      box.appendChild(p);
      document.body.className += " sub-nowebgl";
      document.body.appendChild(box);
      console.log("substratic: webgl " + level + ": the message is up");
    }

    var level = probe("webgl2") ? "webgl2" : probe("webgl") ? "webgl1" : "none";
    // both paths: a boot error after a "no WebGL2 context" line (or with no
    // WebGL 2 at all) is the message's, not the loader's
    var seen = false, watching = true;
    ["log", "warn", "error"].forEach(function (k) {
      var was = console[k];
      console[k] = function () {
        if (watching && !seen) {
          try {
            var line = "";
            for (var i = 0; i < arguments.length; i++) line += " " + String(arguments[i]);
            if (/no WebGL2 context/.test(line)) { seen = true; Promise.resolve().then(function () { show(level === "webgl2" ? "late" : level); }); }
          } catch (err) { /* an argument with no string form */ }
        }
        return was.apply(console, arguments);
      };
    });
    document.addEventListener("sigil-web-app-ready", function () { watching = false; });
    document.addEventListener("sigil-web-app-error", function () {
      // (still watching: a line flushed after the error still clears it)
      if (seen || level !== "webgl2") { clearFailed(); show(level === "webgl2" ? "late" : level); }
    });
    if (level === "webgl2") return level;

    // no WebGL 2: the loader must not run
    var off = function (node) {
      if (node.nodeName === "SCRIPT" && LOADER.test(node.getAttribute("src") || "")) {
        node.type = "text/plain";
        node.setAttribute("data-substratic-off", "no-webgl2");
        return true;
      }
      return false;
    };
    var mo = new MutationObserver(function (records) {
      records.forEach(function (r) { Array.prototype.forEach.call(r.addedNodes, off); });
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener("beforescriptexecute", function (e) { if (off(e.target)) e.preventDefault(); });
    document.addEventListener("DOMContentLoaded", function () { mo.disconnect(); });
    console.log("substratic: webgl " + level + ": " + (window.SigilWebApp
      ? "the loader already ran (this script must come before it)" : "the game is not started"));
    show(level);
    return level;
  }
      window.CrashWebGL = webglGuard({ webglCheck: true, webglText: { title: "The tracker needs WebGL 2, and your browser isn't providing it.",
        late: "Your browser has WebGL 2, but it couldn't give the tracker a WebGL 2 context. Closing other tabs that use graphics, or restarting the browser, usually fixes it." } });
    })();
    </script>
    <!--sigil:app-->
  </main>

  <script>
    // The canvas backing resolution cap, as the game's page (P3c): pixel
    // art gains nothing above dpr 2. ?dpr=N|native overrides.
    var DPR_CAP = 2;
    var realDpr = window.devicePixelRatio || 1;
    (function () {
      var want = new URLSearchParams(location.search).get("dpr");
      var cap = want === "native" ? realDpr : (want && Number(want) > 0 ? Number(want) : DPR_CAP);
      try {
        Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: function () { return Math.min(cap, realDpr); } });
      } catch (e) { /* the property held */ }
    })();

    function withApp(fn) {
      if (globalThis.SigilWebApp) { fn(globalThis.SigilWebApp); return; }
      document.addEventListener("sigil-web-app-ready", function (e) { fn(e.detail); }, { once: true });
    }

    // The tune round trip. The share URL carries the tune text deflated
    // (deflate-raw) as base64url in the fragment (#t=...), so no server sees
    // it; the budget is TUNE_URL_MAX characters (pinned 16,384; a 3 minute
    // tune is ~2,700). Above it the text is offered as a file.
    var TUNE_URL_MAX = 16384;
    function trackerFragment() {
      var m = /(?:^|[#&])t=([A-Za-z0-9_-]+)/.exec(location.hash);
      return m ? m[1] : null;
    }
    function b64urlToBytes(s) {
      s = s.replace(/-/g, "+").replace(/_/g, "/");
      while (s.length % 4) s += "=";
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    function bytesToB64url(bytes) {
      var s = "";
      for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function pipeBytes(bytes, stream) {
      return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
    }
    function trackerInflate(frag) {
      if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("no DecompressionStream"));
      return pipeBytes(b64urlToBytes(frag), new DecompressionStream("deflate-raw")).then(function (bytes) { return new TextDecoder().decode(bytes); });
    }
    function trackerDeflate(text) {
      if (typeof CompressionStream === "undefined") return Promise.reject(new Error("no CompressionStream"));
      return pipeBytes(new TextEncoder().encode(text), new CompressionStream("deflate-raw")).then(bytesToB64url);
    }
    // the text to the tracker, 12 KB of base64 a chunk, then ("tune-done", name)
    function sendTune(app, text, name) {
      var bytes = new TextEncoder().encode(text), CHUNK = 12 * 1024, i = 0;
      while (i < bytes.length) {
        var part = bytes.subarray(i, Math.min(i + CHUNK, bytes.length)), s = "";
        for (var k = 0; k < part.length; k++) s += String.fromCharCode(part[k]);
        app.dispatch("tune-chunk", btoa(s));
        i += CHUNK;
      }
      app.dispatch("tune-done", name);
    }
    // A bundled tune by name, TUNE_TRIES fetches at most (a fetch pending while
    // a worker installs can fail at the network level); the failure line's
    // prefix is its own ("crash: tune-unavailable"), never "crash: tune-fetch",
    // so the hook below cannot re-enter this on its own report (reviewer,
    // 2026-09-21: it did, forever, on a 404).
    var TUNE_TRIES = 3;
    function fetchTune(name, attempt) {
      attempt = attempt || 1;
      if (!/^[a-z0-9-]+$/.test(name)) { console.log("crash: tune-unavailable " + name + " (not a bundled name)"); return; }
      withApp(function (app) {
        // The tracker's own tunes, beside its own page. It fetched
        // ../assets/tunes/ until 2026-09-24, which was the GAME's copy and
        // worked only while the game sat at the site root: after P4b moved it
        // to /jack-in/, ../assets/tunes/ from /tracker/ resolves to the site's
        // root, where there are none, and every bundled tune 404s. The four
        // bundled tunes (103 KB) are copied here by package.sgl's tracker-page
        // instead, so the path is the same in the build tree and on the
        // deployed site and nothing hard-codes /jack-in/.
        fetch("assets/tunes/" + name + ".cts", { cache: "force-cache" }).then(function (r) {
          if (!r.ok) throw new Error("tune " + r.status);
          return r.text();
        }).then(function (text) { sendTune(app, text, name); },
                function (err) {
                  if (attempt < TUNE_TRIES && !/tune 404/.test(err.message)) { setTimeout(function () { fetchTune(name, attempt + 1); }, 800); return; }
                  console.log("crash: tune-unavailable " + name + " " + err.message + " (try " + attempt + ")");
                  sendTune(app, "", "");
                });
      });
    }
    function showTuneShare(name, text) {
      var box = document.getElementById("share-overlay");
      if (box) box.remove();
      box = document.createElement("div"); box.id = "share-overlay";
      box.style.cssText = "position:fixed;left:8px;top:8px;right:8px;max-height:80%;overflow:auto;background:#0d0a1a;color:#cce6ff;border:1px solid #4df2d9;padding:8px;font:12px monospace;z-index:20;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text";
      var close = document.createElement("button"); close.textContent = "close"; close.style.cssText = "float:right;margin-left:8px";
      close.addEventListener("click", function () { box.remove(); });
      box.appendChild(close);
      var body = document.createElement("div"); box.appendChild(body);
      document.body.appendChild(box);
      var offerFile = function (why) {
        body.textContent = why + "\n";
        var a = document.createElement("a");
        a.textContent = "download " + name + ".cts (" + text.length + " bytes)";
        a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
        a.download = name + ".cts";
        body.appendChild(a);
      };
      trackerDeflate(text).then(function (data) {
        var dir = location.pathname.replace(/[^/]*$/, "");   // /tracker/
        var url = location.origin + dir + "#t=" + data;
        console.log("crash: tune-url " + url.length + " chars");
        if (url.length > TUNE_URL_MAX) { offerFile("the share URL would be " + url.length + " characters, over the " + TUNE_URL_MAX + " budget; the tune as a file instead:"); return; }
        body.textContent = "share URL (" + url.length + " chars):\n" + url + "\n\n";
        var copy = document.createElement("button"); copy.textContent = "copy URL";
        copy.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function () { copy.textContent = "copied"; }, function () { copy.textContent = "select and copy"; });
          else copy.textContent = "select and copy";
        });
        body.appendChild(copy);
      }, function (err) { offerFile("no CompressionStream here (" + err.message + "); the tune as a file instead:"); });
    }

    // The page owns the keyboard while the tracker is up (David, 2026-09-21:
    // Shift-Tab was moving the browser's focus): every key the tracker binds
    // is prevented at the capture phase, so Tab, Space, the arrows, PgUp/PgDn,
    // Home/End, F1..F12, Escape, backquote and every chord never reach the
    // browser; only its reserved chords do (Ctrl-W/T/N/Q, Ctrl-Shift-I,
    // Ctrl-L, F5, F11, F12). The canvas takes focus on load and on any click.
    var OWNED = /^(Tab| |Arrow(Up|Down|Left|Right)|Page(Up|Down)|Home|End|F[1-9]|F1[0-2]|Escape|Enter|Backspace|Delete|Insert|`)$/;
    function browserReserved(e) {
      var k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (k === "w" || k === "t" || k === "q" || k === "l")) return true;
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === "i" || k === "j" || k === "c")) return true;
      return k === "f5" || k === "f11" || k === "f12";
    }
    document.addEventListener("keydown", function (e) {
      if (document.body.classList.contains("sub-nowebgl")) return;   // the WebGL 2 message: Tab and Enter reach its link
      if (browserReserved(e)) return;
      if (OWNED.test(e.key) || e.ctrlKey || e.altKey || e.metaKey) e.preventDefault();
    }, true);
    var stage = document.getElementById("stage");
    stage.focus();
    document.addEventListener("pointerdown", function () { if (!document.body.classList.contains("sub-nowebgl")) stage.focus(); }, true);

    // The loader drops every key event with Ctrl, Alt or Meta held; the
    // tracker's chords (Ctrl-Z undo, Ctrl-E share, Alt-1..8 mute, ...) are
    // forwarded here, with the browser's own bindings (Ctrl-S, Ctrl-O,
    // Ctrl-N, Alt-digit tabs) prevented. This page is the tracker's alone,
    // so there is no gate.
    ["keydown", "keyup"].forEach(function (type) {
      document.addEventListener(type, function (e) {
        if (!(e.ctrlKey || e.altKey || e.metaKey) || browserReserved(e)) return;
        withApp(function (app) { app.dispatch(type, e.key); });
        e.preventDefault();
      }, true);
    });

    // The tracker's lines the page acts on (the rest go to the console as they are).
    (function () {
      var log = console.log;
      console.log = function () {
        var first = arguments[0];
        if (typeof first === "string" && first.indexOf("crash: tune-share ") === 0) {
          var rest = first.slice("crash: tune-share ".length), sp = rest.indexOf(" ");
          var name = rest.slice(0, sp), b64 = rest.slice(sp + 1);
          showTuneShare(name, new TextDecoder().decode(b64urlToBytes(b64)));
          return log.call(console, "crash: tune-share " + name + " " + b64.length + " chars");   // the arm reads the line, not the payload
        }
        if (typeof first === "string" && first.indexOf("crash: tune-fetch ") === 0) {
          fetchTune(first.slice("crash: tune-fetch ".length).trim());
        }
        return log.apply(console, arguments);
      };
    })();

    // The wheel scrolls the pattern (the loader forwards no wheel): one
    // ("wheel", deltaY) a notch, the page's own scroll prevented.
    document.addEventListener("wheel", function (e) {
      withApp(function (app) { app.dispatch("wheel", String(e.deltaY)); });
      e.preventDefault();
    }, { passive: false, capture: true });

    // Every user gesture reaches the tracker as ("gesture", name), so it
    // can resume its audio context whenever the browser suspended it.
    ["pointerup", "touchend", "click", "keydown"].forEach(function (name) {
      document.addEventListener(name, function () {
        withApp(function (app) { app.dispatch("gesture", name); });
      }, true);
    });

    withApp(function (app) {
      var params = new URLSearchParams(location.search);
      var coarse = matchMedia("(pointer: coarse)").matches;
      if (params.has("trace")) app.dispatch("trace", "on");
      if (coarse) app.dispatch("touch", "on");
      app.dispatch("dpr", String(window.devicePixelRatio));
      // ?tune=NAME opens a bundled tune; #t=... a shared one (the fragment wins)
      var frag = trackerFragment();
      if (frag) trackerInflate(frag).then(function (text) { sendTune(app, text, "shared"); },
                                          function (err) { console.log("crash: tune-fragment failed " + err.message); sendTune(app, "", ""); });
      else if (params.get("tune")) app.dispatch("tune", params.get("tune"));
      app.dispatch("version", "__VERSION__");
    });
  </script>
</body>
</html>
